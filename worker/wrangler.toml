name = "songdle-report"
main = "report.js"
compatibility_date = "2026-10-01"

[vars]
GITHUB_REPO = "Oliverszkcs/songdle-hu"

# IP-nként legfeljebb 5 jelentés percenként.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Deezer-közvetítő: IP-nként legfeljebb 300 kérés percenként.
[[ratelimits]]
name = "DEEZER_LIMITER"
namespace_id = "1002"
simple = { limit = 300, period = 60 }
